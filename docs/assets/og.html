<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #08080a;
        color: #ececec;
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        position: relative;
      }
      .glow {
        position: absolute;
        left: 50%;
        top: -180px;
        width: 920px;
        height: 520px;
        transform: translateX(-50%);
        background: radial-gradient(ellipse at 50% 40%, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0) 64%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at 50% 42%, #000 18%, transparent 72%);
      }
      .frame {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px 72px 56px;
      }
      .mark { width: 108px; height: 108px; }
      .name {
        margin-top: 18px;
        font-size: 64px;
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #fff;
      }
      .four {
        background: linear-gradient(135deg, #ffffff 0%, #c2c2cc 48%, #6f6f7a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .eyebrow {
        margin-top: 16px;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.62);
      }
      .tagline {
        margin-top: 28px;
        font-size: 40px;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1.2;
        color: #f4f4f6;
      }
      .tagline span { display: block; }
      .plates {
        margin-top: 34px;
        display: flex;
        align-items: flex-end;
        gap: 22px;
      }
      .plates svg { display: block; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="frame">
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M16 22.4L27 26L16 29.6L5 26Z" fill="url(#base)" />
        <path d="M16 14.6L27 18.2L16 21.8L5 18.2Z" fill="url(#mid)" />
        <path d="M16 4.048L25.02 7L16 9.952L6.98 7Z" fill="url(#top)" />
        <defs>
          <linearGradient id="base" x1="5" y1="22" x2="27" y2="30" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#6e6e79" /><stop offset="1" stop-color="#44444d" />
          </linearGradient>
          <linearGradient id="mid" x1="5" y1="14" x2="27" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#a6a6b1" /><stop offset="1" stop-color="#66666f" />
          </linearGradient>
          <linearGradient id="top" x1="7" y1="4" x2="25" y2="10" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#c8c8d2" />
          </linearGradient>
        </defs>
      </svg>
      <div class="name">Stack<span class="four">4</span>That</div>
      <div class="eyebrow">AI stack architect</div>
      <p class="tagline">
        <span>Describe what you are building.</span>
        <span>Watch the stack assemble.</span>
      </p>
      <div class="plates" aria-hidden="true">
        <svg width="86" height="34" viewBox="0 0 86 34" fill="none">
          <path d="M43 2L80 17L43 32L6 17Z" fill="#5c5c66" />
        </svg>
        <svg width="104" height="40" viewBox="0 0 104 40" fill="none">
          <path d="M52 2L98 20L52 38L6 20Z" fill="#8e8e99" />
        </svg>
        <svg width="128" height="50" viewBox="0 0 128 50" fill="none">
          <path d="M64 2L122 25L64 48L6 25Z" fill="#f4f4f7" />
        </svg>
        <svg width="104" height="40" viewBox="0 0 104 40" fill="none">
          <path d="M52 2L98 20L52 38L6 20Z" fill="#8e8e99" />
        </svg>
        <svg width="86" height="34" viewBox="0 0 86 34" fill="none">
          <path d="M43 2L80 17L43 32L6 17Z" fill="#5c5c66" />
        </svg>
      </div>
    </div>
  </body>
</html>
